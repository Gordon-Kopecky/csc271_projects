<body>
<div class="header">
  <h1 class="logo">Study Spot Finder</h1>
  <nav>
    <img src="./Documentation/Kopecky_logo.png" alt="Study Spot Finder Logo" width="50" height="50">
    <a href="About_us.html">About Us</a>
    <a href="FAQ'S.html">FAQ's</a>
    <a href="reviews.html">Reviews</a>
    <a href="Welcome_page.html">Welcome</a>
  </nav>
</div>

<div class="content">
    <h1>Student Reviews</h1> <!-- Main heading -->
    <strong>Rate Our Page!</strong>
    <br>
    <form>
        <input type="radio" name="rating" value="1"> 1<br>
        <input type="radio" name="rating" value="2"> 2<br>
        <input type="radio" name="rating" value="3"> 3<br>
        <input type="radio" name="rating" value="4"> 4<br>
        <input type="radio" name="rating" value="5"> 5<br>
        <button id="rateBtn" type="button">Submit</button>

    </form>
    
      <p id="ratingMessage"></p>
      <p class="average-text"></p>
    <hr>

    <h2>Leave a Review!</h2>
    <form>
        <label for="name">Full name:</label><br>
        <input type="text" id="name" name="name" placeholder="Your Name"><br>

        <label for="review">Leave a review:</label><br>
        <textarea id="review" name="review" rows="4" cols="40" placeholder="Write your review here"></textarea><br>

        <button id="reviewBtn" type="button">Submit</button>
    </form>
    <p id="reviewMessage"></p>
    <div id="allReviews"></div>
</div>
<script src="js/rating.js"></script>
<script src="js/reviews.js"></script>
