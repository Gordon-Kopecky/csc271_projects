<!DOCTYPE html>
<html>
<head>
  <title>Submit Recipe</title>
</head>
<body>

  <h1>Submit a Recipe</h1>

  <form>
    recipe name: <input type="text" name="recipe name"><br>
    ingredients and instructions:<br>
    <textarea name="ingredients"></textarea><br>
    difficulty:
    <br>
    <input type="radio" name="difficulty" value="Easy"> Easy<br>
    <input type="radio" name="difficulty" value="Medium"> Medium<br>
    <input type="radio" name="difficulty" value="Hard"> Hard<br>
    dietary preferences:
    <br>
    <input type="checkbox" name="diet" value="Vegetarian"> Vegetarian<br>
    <input type="checkbox" name="diet" value="Vegan"> Vegan<br>
    <input type="checkbox" name="diet" value="Other"> Other<br>
    <br>
    <input type="submit" value="Submit">
  </form>

  <a href="index.html">Back to my page</a>

</body>
</html>
